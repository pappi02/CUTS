<!DOCTYPE html>
<html>
<head>
    <title>New Comment on Ticket</title>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #059669;">[CUTS] New comment on Ticket #{{ ticket.id }}</h2>
    <p>Hello,</p>
    <p>{{ commenter }} added a new comment to "{{ ticket.title }}".</p>
    <p><strong>Comment:</strong><br>{{ comment.content|linebreaks|truncatewords:100 }}</p>
    <p style="background: #f3f4f6; padding: 15px; border-radius: 5px;">
        <strong>View the ticket:</strong><br>
        <a href="{{ ticket_url }}" style="background: #059669; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Open Ticket #{{ ticket.id }}</a>
    </p>
    <hr>
    <p>Reply to this email to add a comment.</p>
    <p>Best regards,<br>CUTS Helpdesk</p>
</body>
</html>
